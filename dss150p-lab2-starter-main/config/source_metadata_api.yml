source_name: "events_api"
source_type: "rest_api"
location_or_endpoint: "http://127.0.0.1:8000/api/events"
owner: "Platform Real-Time Services Team"
description: "User interaction and platform event telemetry stream exposed via paginated REST API."
record_count: 100
schema:
  - name: event_id
    type: string
    description: "Unique event identifier"
  - name: customer_id
    type: string
    description: "Foreign key reference to customers"
  - name: event_type
    type: string
    description: "Event category (login, page_view, checkout_started, payment_processed)"
  - name: updated_at
    type: string
    description: "ISO-8601 UTC timestamp of event state mutation"
  - name: payload
    type: object
    description: "Contextual event payload"
primary_or_candidate_key: "event_id"
update_pattern: "incremental_watermark"
known_quality_issues:
  - "Event mutations result in identical event_ids appearing with newer updated_at values"
  - "Requires deterministic deduplication: GROUP BY event_id KEEP MAX(updated_at)"
  - "Endpoint exposes updated_after query param for incremental watermark ingestion"
acquisition_method: "paginated_rest_get"
validation_checks:
  - "Traverse all pages until has_more is False"
  - "Add _ingested_at and _source metadata fields"
  - "Deduplicate on event_id preserving greatest updated_at"
  - "Write raw/api/events.jsonl via atomic temporary file rename"
  - "Advance watermark in state/api_watermark.json ONLY after write completes"
